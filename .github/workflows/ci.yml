name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Der Workflow liest nur das Repository; mehr braucht der Build nicht.
# Ohne diesen Block erbte GITHUB_TOKEN die (moeglicherweise weitreichende)
# Standardeinstellung des Repositories.
permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B verify
